[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baltic-home-compass"
version = "0.1.0"
description = "Housing and household economic indicators for the Baltic countries."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["backend*", "database*", "pipelines*"]

[tool.setuptools.package-data]
database = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "pipelines/tests"]
markers = ["integration: requires an isolated PostgreSQL database via TEST_DATABASE_URL"]
